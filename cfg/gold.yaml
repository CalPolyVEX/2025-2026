# Robot configuration
driver: chris
color: gold

hex_primary: 0xC69214
hex_secondary: 0x2a2b2c
hex_tertiary: 0x154734
hex_blue: 0x4EACEC
hex_red: 0xe63242

pneumatics:
  
  loader:
    port: 22
    pin: "a"
  wing:
    port: 22
    pin: "f"

motorGroups:
  leftDrive:
    L1:
      port: 2
      rev: true
    L2:
      port: 10
      rev: true
    L3:
      port: 6
      rev: true
    L4:
      port: 8
      rev: false
  rightDrive:
    R1:
      port: 4
      rev: true
    R2:
      port: 3
      rev: false
    R3:
      port: 5
      rev: false
    R4:
      port: 1
      rev: false
  
  intake:
    intake1:
      port: 20
      rev: false
    intake2:
      port: 11
      rev: true

  roller:
    port: 13
    rev: false


opticals:
  frontOpti:
    port: 20

# distances:
#   leftDist:
#     port: 2

# encoders: # extra encoders (NOT ODOM)
#   test:
#     port: 22
#     pin: "a"

chassis:
  drive_setup: "ZERO_TRACKER_ODOM"
  gear_input: 1
  gear_output: 4.5
  wheel_diameter: 3.75
  encoders:
    sideways:
      port: 22
      pin: "a"
      diameter: 2.04
      center_dist: 3.0
    forward:
      port: 22
      pin: "c"
      diameter: 2.04
      center_dist: 3.0
  drivetrain:
    left: "leftDrive"
    right: "rightDrive"
  inertial:
    port: 21
