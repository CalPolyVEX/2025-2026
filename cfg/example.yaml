# Robot configuration

# name of driver goes here, which determines what is placed into controls.h
driver: chris

# this is placed into colors.h
color: gold

# this is placed into colors.h
hex_primary: 0xC69214
hex_secondary: 0x2a2b2c
hex_tertiary: 0x154734
hex_blue: 0x4EACEC
hex_red: 0xe63242

# this is a table of all pneumatics on the robot
# port is the smart port that the triport resides on (1-22)
# pin is the pin that the solenoid is on (a-h)
pneumatics:
  lowerGate:
    port: 22
    pin: h
  matchLoad:
    port: 22
    pin: g

# this is a table of all three-wire encoders on the robot
# port is the smart port that the triport resides on (1-22)
# pin is the pin that the encoder's A line is on (a-h)
# encoders must have adjacent pins, ex: AB CD EF GH,
# but you only put the leading one.
encoders:
  test:
    port: 22
    pin: a

# all motors are placed into a motor group, 
# with variable number of motors
# or just as a single motor
# port is the motor port
# rev is true if the motor should be reversed, false otherwise
motorGroups:
  leftDrive:
    L1:
      port: 20
      rev: false
    L2:
      port: 19
      rev: true
    L3:
      port: 18
      rev: false
    L4:
      port: 17
      rev: true
  rightDrive:
    R1:
      port: 16
      rev: false
    R2:
      port: 15
      rev: true
    R3:
      port: 14
      rev: false
    R4:
      port: 13
      rev: true
  conveyor:
    port: 11
    rev: false

# table for the optical sensors
# port is the port the sensor should be on
opticals:
  frontOpti:
    port: 8

# table for the distance sensors
# port is the port the sensor should be on
distances:
  leftDist:
    port: 2

# table for the JARTemplate chassis object config
# this will be placed into src/chassis.cpp
# check that file for documentation on all of these parameters
chassis:
  drive_setup: ZERO_TRACKER_ODOM
  gear_input: 1
  gear_output: 4.5
  wheel_diameter: 3.75
  encoders:
    sideways:
      port: 22
      pin: a
      diameter: 2.04
      center_dist: 3.0
    forward:
      port: 22
      pin: c
      diameter: 2.04
      center_dist: 3.0
  drivetrain:
    left: leftDrive
    right: rightDrive
  inertial:
    port: 21