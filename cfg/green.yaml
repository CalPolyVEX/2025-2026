#   leftDist:
#     port: 2

# encoders: # extra encoders (NOT ODOM)
#   test:
#     port: 22
#     pin: "a"

chassis:
  drive_setup: "ZERO_TRACKER_ODOM"
  gear_input: 1
  gear_output: 4.5
  wheel_diameter: 3.75
